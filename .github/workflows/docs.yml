# Publishes the lab documentation to GitHub Pages.
#
# The page is built by docs/build.py (markdown-it-py + Pygments, dependencies declared
# in PEP 723 → installed by uv). The artifact is NOT versioned: it is regenerated on
# every push to main, which avoids a ~500 KB diff for every documentation change.
#
# Repository prerequisite, to do ONCE: Settings → Pages → Source = "GitHub Actions".
# Published URL: https://<owner>.github.io/<repo>/
name: docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - docs/build.py
      - .github/workflows/docs.yml
  workflow_dispatch: {}

# Minimal rights: read the code, write Pages, and the OIDC that deploy-pages requires.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling the running one (Pages dislikes that).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv no longer publishes a floating major tag beyond v7:
      # we pin the exact version (a `@v9` does not exist and fails the job).
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # build.py queries git (ls-files, check-ignore, log -1): the checkout is enough.
      - name: Generate the page
        run: uv run docs/build.py --out _site/index.html

      # Safety rail: no secret may end up in the published page.
      - name: Check for the absence of secrets
        run: |
          if grep -qE 'hvs\.[A-Za-z0-9]{15,}|cfat_[A-Za-z0-9]{15,}|-----BEGIN [A-Z ]*PRIVATE KEY' _site/index.html; then
            echo "::error::A secret pattern was detected in the generated page." && exit 1
          fi
          echo "✅ no secret pattern detected"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
