# envoyproxy-l2.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: cilium-l2
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerClass: io.cilium/l2-announcer
        externalTrafficPolicy: Cluster
---
# gatewayclass.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: cilium-l2
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: envoy-gateway-system      # Gateway + cert wildcard hors du ns default
  annotations:
    # cert-manager émet et renouvelle le wildcard TLS tout seul (DNS-01 Cloudflare).
    # Le Certificate + le Secret wildcard-talos-lab-example-io-tls sont créés dans CE namespace.
    #
    # Défaut STAGING volontaire : Let's Encrypt production plafonne à 5 certificats par
    # semaine et par jeu d'identifiants, or le wildcard ne vit que dans etcd — chaque
    # `vagrant destroy` en brûle donc un. Au 6e rebuild d'une même semaine, plus de TLS
    # pendant des heures. platform-up.sh remplace cette valeur par `letsencrypt-prod`
    # quand LAB_ACME_ISSUER=prod (cf. lab.env.example).
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      # Domaine NEUTRE (dépôt public) : platform-up.sh le remplace par LAB_DOMAIN (lab.env),
      # et le nom du Secret TLS ci-dessous suit (wildcard-<domaine-en-tirets>-tls).
      hostname: "*.talos.lab.example.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-talos-lab-example-io-tls   # rempli automatiquement par cert-manager
      allowedRoutes:
        namespaces:
          from: All

