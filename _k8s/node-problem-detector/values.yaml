# values.yaml — node-problem-detector (chart deliveryhero) ADAPTÉ TALOS.
#
# NPD est un DaemonSet qui surveille la SANTÉ DES NODES et remonte les problèmes en
# NodeConditions + Events (KernelDeadlock, ReadonlyFilesystem, OOM, TaskHung, KernelOops,
# erreurs FS/IO...). Utile ici : c'est exactement le genre de panne qui a figé cp2.
#
# Adaptation Talos : on ne garde QUE le kernel-monitor (lecture de /dev/kmsg). Les autres
# moniteurs du chart (docker-monitor, systemd) reposent sur docker/journald qui N'EXISTENT
# PAS sur Talos (pas de systemd, /var/log/journal absent) → ils échouent. On les retire.
settings:
  log_monitors:
    - /config/kernel-monitor.json      # kmsg -> détecte OOM / TaskHung / KernelOops / Ext4/IO errors
  custom_monitors: []

# NPD tourne en privileged (accès /dev/kmsg) — le namespace doit être en PodSecurity
# `privileged` (posé par node-problem-detector-up.sh ; défaut cluster Talos = baseline).
securityContext:
  privileged: true

# Tolère tous les taints NoSchedule => tourne AUSSI sur les control-plane (surveille cp1/2/3).
tolerations:
  - effect: NoSchedule
    operator: Exists

# Métriques Prometheus exposées (port 20257). ServiceMonitor OFF tant que l'addon
# observability n'a pas ses CRD Prometheus-Operator ; à passer à true ensuite.
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
