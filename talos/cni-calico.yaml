# CNI = Calico (`CNI=calico` in lab.env).
#
# Talos installs NO CNI at bootstrap: `./_k8s/platform-up.sh` lays Calico down right
# after, through the Tigera operator (see _k8s/calico/README.md).
#
# ⚠️ Calico provides the CNI (pod network, routing, NetworkPolicy) but does NOT
# advertise LoadBalancer Service IPs: it can only do so over BGP, which requires a
# peer router — absent from a VirtualBox host-only network. Without an extra L2
# announcer (MetalLB), the Envoy Gateway Service stays at
# `EXTERNAL-IP <pending>` and no lab UI is reachable.
# See _k8s/calico/README.md for the procedure.
#
# The Calico `IPPool` must cover the same CIDR as `cluster.network.podSubnets`
# (Talos default: 10.244.0.0/16) — that is set in _k8s/calico/installation.yaml.
#
# Normal consequence: between the bootstrap and the Calico install, the nodes stay
# `NotReady`. That is not an error.
cluster:
  network:
    cni:
      name: none
