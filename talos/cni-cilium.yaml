# CNI = Cilium (the lab's recommended choice, `CNI=cilium` in lab.env).
#
# Talos installs NO CNI at bootstrap: `./_k8s/platform-up.sh` lays Cilium down right
# after, with the pinned chart and the L2 LoadBalancer IP pool
# (see _k8s/cilium/README.md).
#
# Why this file exists even though it says the same thing as cni-none.yaml:
# the CNI variable expresses an INTENT, not the Talos field. `cni-none.yaml` means
# "I will lay down my own CNI, the lab stays out of it"; `cni-cilium.yaml` means
# "the lab will lay down Cilium". The dispatch happens in platform-up.sh.
#
# Normal consequence: between the bootstrap and the Cilium install, the nodes stay
# `NotReady` and CoreDNS `Pending`. That is not an error.
#
# The kube-proxy decision is NOT here: it lives in `talos/patch-no-kube-proxy.yaml`,
# which cluster-up.sh adds to the generated config when KUBE_PROXY_REPLACEMENT=true
# (the lab default). Two intents, two patches — this file would otherwise be wrong
# for KUBE_PROXY_REPLACEMENT=false.
cluster:
  network:
    cni:
      name: none
