# CNI = Cilium (choix recommandé du lab, `CNI=cilium` dans lab.env).
#
# Talos n'installe AUCUN CNI au bootstrap : c'est `./_k8s/platform-up.sh` qui pose
# Cilium juste après, avec le chart épinglé et le pool d'IP LoadBalancer L2
# (cf. _k8s/cilium/README.md).
#
# Pourquoi ce fichier existe alors qu'il dit la même chose que cni-none.yaml :
# la variable CNI exprime une INTENTION, pas le champ Talos. `cni-none.yaml` veut
# dire « je poserai mon CNI moi-même, le lab ne s'en occupe pas » ; `cni-cilium.yaml`
# veut dire « le lab posera Cilium ». Le dispatch se fait dans platform-up.sh.
#
# Conséquence normale : entre le bootstrap et l'installation de Cilium, les nodes
# restent `NotReady` et CoreDNS `Pending`. Ce n'est pas une erreur.
cluster:
  network:
    cni:
      name: none
  # Cilium est installé ici avec kubeProxyReplacement=false : on GARDE le kube-proxy
  # de Talos. Pour déléguer le service routing à Cilium, décommenter ci-dessous ET
  # installer Cilium avec kubeProxyReplacement=true + k8sServiceHost/<VIP> :6443.
  # proxy:
  #   disabled: true
