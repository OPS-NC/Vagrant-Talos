# CNI = Flannel. Applied to the control planes by cluster-up.sh
# (variable CNI=flannel) => Talos renders and deploys the flannel manifest at bootstrap.
#
# By default flannel picks the public IP of its VXLAN tunnel on the interface of the
# DEFAULT ROUTE = the NAT NIC (eth0, 10.0.2.15, IDENTICAL on every VM).
# Result: every VTEP points at an isolated NAT => cross-node pod traffic (hence DNS
# towards a CoreDNS on another node) is broken. So we force flannel to pick the
# interface that reaches the host-only network (--iface-can-reach = the host
# 192.168.56.1) => VTEP on enp0s8.
#
# NB: rendered into the manifest at bootstrap. On an ALREADY running cluster, Talos does
# not push the update by itself (see README §7); patch the DaemonSet by hand.
cluster:
  network:
    cni:
      name: flannel
      flannel:
        extraArgs:
          - --iface-can-reach=192.168.56.1
