# CNI = none: Talos installs NO CNI. Use this when you deploy a third-party CNI
# yourself (Cilium, Calico...). Selected by CNI=none in cluster-up.sh.
#
# After the bootstrap, the nodes stay NotReady until a CNI is installed
# (that is normal). See README §9 to install Cilium in VXLAN mode.
#
# Delegating kube-proxy to Cilium is driven by KUBE_PROXY_REPLACEMENT (lab.env), which
# makes cluster-up.sh add `talos/patch-no-kube-proxy.yaml` — but that variable REQUIRES
# CNI=cilium, so with `CNI=none` kube-proxy is always the one Talos installed. If you
# lay down a CNI that replaces it yourself, apply that patch by hand and install your CNI
# with kubeProxyReplacement=true + k8sServiceHost=<VIP> k8sServicePort=6443.
cluster:
  network:
    cni:
      name: none
