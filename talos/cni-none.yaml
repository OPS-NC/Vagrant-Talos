# CNI = none: Talos installs NO CNI. Use this when you deploy a third-party CNI
# yourself (Cilium, Calico...). Selected by CNI=none in cluster-up.sh.
#
# After the bootstrap, the nodes stay NotReady until a CNI is installed
# (that is normal). See README §9 to install Cilium in VXLAN mode.
#
# Common option with Cilium: delegate kube-proxy to Cilium. If you want that,
# uncomment `proxy.disabled: true` below AND install Cilium with
# kubeProxyReplacement=true + k8sServiceHost=<VIP> k8sServicePort=6443.
cluster:
  network:
    cni:
      name: none
  # proxy:
  #   disabled: true
