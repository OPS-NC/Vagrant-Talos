# Patch applied to ALL nodes (control planes + workers).
#
# On VirtualBox every VM has 2 NICs:
#   - eth0 = VirtualBox NAT (10.0.2.15, IDENTICAL on every VM) -> Internet
#   - eth1 = host-only 192.168.56.0/24 (IP reserved by MAC)    -> cluster
#
# So we force the kubelet (and therefore the node IP) onto the host-only network,
# otherwise every node would advertise the same NAT IP 10.0.2.15.
machine:
  kubelet:
    nodeIP:
      validSubnets:
        - 192.168.56.0/24

cluster:
  # "Online" discovery through the external discovery.talos.dev service ("service"
  # registry). The "kubernetes" registry is DEPRECATED and incompatible with
  # Kubernetes >= 1.32 (AuthorizeNodeWithSelectors feature gate): we disable it
  # explicitly. talosctl gen config v1.13 deploys Kubernetes 1.36 by default.
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service:
        disabled: false
