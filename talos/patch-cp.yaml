# Patch applied to the control planes ONLY.
#
# - Sets the Kubernetes API VIP (Virtual IP) on the host-only NIC.
#   The VIP floats between the control planes (election through etcd): it is what
#   serves as the stable endpoint https://192.168.56.5:6443, in single (1 CP) as
#   well as in HA (3 CP).
# - We target the NIC by busPath and NOT by name: since Talos 1.5 interfaces get
#   "predictable" names (so the host-only one is NOT "eth1" but "enp0s8").
#   busPath "0000:00:08.0" = 2nd VirtualBox NIC (host-only), whatever the name.
#   Check it if needed: talosctl -n <ip> get links
machine:
  network:
    interfaces:
      - deviceSelector:
          busPath: "0000:00:08.0"
        dhcp: true
        vip:
          ip: 192.168.56.5

cluster:
  # etcd advertises and listens on the host-only network (not on the NAT IP).
  etcd:
    advertisedSubnets:
      - 192.168.56.0/24

# NB: the CNI choice is NOT here — it is driven by a dedicated patch
# (talos/cni-flannel.yaml by default, talos/cni-none.yaml for Cilium & co),
# selected by the CNI variable of cluster-up.sh. See README §9.
